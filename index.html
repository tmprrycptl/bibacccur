<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Journal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f5f1;
    --card: #ffffff;
    --border: #dedad3;
    --text: #17160e;
    --muted: #8c877e;
    --accent: #4a4438;
    --accent-bg: #eeece7;
    --green: #4a7c5e;
    --ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'Courier New', Courier, monospace;
  }

  body {
    font-family: var(--ui);
    background: var(--bg);
    color: var(--text);
    padding: 36px 20px 80px;
    line-height: 1.5;
  }

  .wrap { max-width: 680px; margin: 0 auto; }

  .hdr {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 16px; margin-bottom: 28px;
    border-bottom: 2px solid var(--text);
  }
  .hdr h1 { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  #journalDate {
    font-family: var(--mono); font-size: 0.78rem; color: var(--muted);
    background: transparent; border: 1px solid transparent; border-radius: 4px;
    padding: 2px 5px; outline: none; text-align: right; width: 230px; cursor: text;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  #journalDate:focus { border-color: var(--border); background: var(--bg); color: var(--text); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  .clabel {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); padding: 8px 18px; background: var(--accent-bg); border-bottom: 1px solid var(--border);
  }

  .field { display: grid; grid-template-columns: 120px 1fr; border-bottom: 1px solid var(--border); }
  .field:last-child { border-bottom: none; }
  .fl {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent); padding: 12px 12px 12px 18px; padding-top: 13px;
    border-right: 1px solid var(--border); background: #fdfcfa;
  }
  .fi { padding: 9px 14px; }

  input[type="number"], input[type="text"], textarea {
    font-family: var(--ui); font-size: 0.875rem; color: var(--text);
    background: transparent; border: 1px solid transparent; border-radius: 5px;
    padding: 4px 7px; width: 100%; outline: none; resize: vertical;
    transition: border-color 0.15s, background 0.15s;
  }
  input[type="number"]:focus,
  input[type="text"]:focus, textarea:focus { border-color: var(--border); background: var(--bg); }
  .time-input { max-width: 90px; font-family: var(--mono); letter-spacing: 0.04em; }
  .score-input { max-width: 72px; }
  input[type="number"] { max-width: 80px; }
  textarea { min-height: 68px; line-height: 1.6; }
  textarea.tall { min-height: 104px; }
  textarea::placeholder, input::placeholder { color: #c4bdb5; font-style: italic; font-size: 0.82rem; }

  .yn-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .yn { display: flex; gap: 18px; }
  .yn label { display: flex; align-items: center; gap: 5px; font-size: 0.875rem; cursor: pointer; user-select: none; }
  .yn input[type="radio"] { width: auto; padding: 0; border: none; accent-color: var(--accent); cursor: pointer; }
  .mins-group { display: flex; align-items: center; gap: 5px; border-left: 1px solid var(--border); padding-left: 14px; }
  .mins-label { font-size: 0.78rem; color: var(--muted); }

  .nrow { display: flex; align-items: center; gap: 6px; }
  .unit { font-size: 0.82rem; color: var(--muted); }

  .supp-list { display: flex; flex-direction: column; }
  .supp-item { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--bg); }
  .supp-item:last-child { border-bottom: none; }
  .supp-name { font-size: 0.875rem; flex: 1; min-width: 0; }
  .supp-dose {
    font-size: 0.72rem; color: var(--muted); font-family: var(--mono);
    background: var(--accent-bg); padding: 2px 7px; border-radius: 3px;
    white-space: nowrap; min-width: 58px; text-align: right;
  }
  .supp-name-input {
    font-family: var(--ui); font-size: 0.875rem; color: var(--text);
    background: transparent; border: 1px solid transparent; border-radius: 4px;
    padding: 3px 6px; flex: 1; outline: none; min-width: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .supp-dose-input {
    font-family: var(--mono); font-size: 0.72rem; color: var(--muted);
    background: var(--accent-bg); border: 1px solid transparent; border-radius: 3px;
    padding: 2px 7px; width: 72px; outline: none; text-align: right;
    transition: border-color 0.15s;
  }
  .supp-name-input:focus, .supp-dose-input:focus { border-color: var(--border); background: var(--bg); }
  .supp-name-input::placeholder, .supp-dose-input::placeholder { color: #c4bdb5; font-style: italic; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
  .step-btn {
    background: var(--accent-bg); color: var(--accent); border: none;
    width: 26px; height: 26px; font-size: 1rem; line-height: 1; cursor: pointer;
    padding: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 400; letter-spacing: 0; border-radius: 0; transition: background 0.1s; font-family: var(--ui);
  }
  .step-btn:hover { background: var(--border); opacity: 1; transform: none; }
  .step-val { min-width: 26px; text-align: center; font-size: 0.82rem; font-family: var(--mono); color: var(--muted); padding: 0 2px; user-select: none; transition: color 0.15s; }
  .step-val.active { color: var(--text); font-weight: 700; }
  .supp-reset { font-size: 0.65rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px 0 2px; text-decoration: underline; font-family: var(--ui); letter-spacing: 0; display: block; margin-top: 2px; }
  .supp-reset:hover { color: var(--accent); opacity: 1; transform: none; }

  .actions { display: flex; gap: 10px; margin: 22px 0 30px; }
  button {
    font-family: var(--ui); cursor: pointer; border: none; border-radius: 7px;
    font-size: 0.85rem; font-weight: 600; letter-spacing: 0.03em; padding: 10px 22px;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  button:hover  { opacity: 0.82; }
  .btn-p { background: var(--text); color: #fff; }
  .btn-o { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-s { padding: 7px 14px; font-size: 0.78rem; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--border); }

  .out-wrap { display: none; }
  .out-wrap.show { display: block; }
  .out-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .out-lbl { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .out-btns { display: flex; gap: 8px; align-items: center; }
  .copy-ok { font-size: 0.68rem; color: var(--green); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .copy-ok.show { opacity: 1; }

  .vault-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding: 8px 14px;
    background: var(--accent-bg); border: 1px solid var(--border);
    border-radius: 7px; font-size: 0.72rem;
  }
  .vault-status { display: flex; align-items: center; gap: 7px; color: var(--muted); }
  .vault-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.2s; }
  .vault-dot.connected { background: var(--green); }
  .vault-name { font-family: var(--mono); color: var(--text); }
  .vault-change { font-size: 0.68rem; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; font-family: var(--ui); letter-spacing: 0; }
  .vault-change:hover { color: var(--accent); opacity: 1; transform: none; }
  .btn-vault {
    padding: 7px 14px; font-size: 0.78rem; font-weight: 600;
    background: var(--accent); color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
    transition: opacity 0.15s; white-space: nowrap;
  }
  .btn-vault:hover { opacity: 0.82; }
  .vault-saved { font-size: 0.68rem; color: var(--green); opacity: 0; transition: opacity 0.3s; pointer-events: none; margin-right: 4px; }
  .vault-saved.show { opacity: 1; }

  #output {
    font-family: var(--ui); font-size: 0.875rem; line-height: 1.8;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 24px 28px; white-space: pre-wrap; word-break: break-word;
    color: var(--text); min-height: 160px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <h1>Daily Journal</h1>
    <input type="text" id="journalDate" title="Click to edit date">
  </div>

  <!-- DAY -->
  <div class="card">
    <div class="clabel">Day</div>
    <div class="field">
      <div class="fl">Intention</div>
      <div class="fi"><input type="text" id="intention"></div>
    </div>
    <div class="field">
      <div class="fl">Mood</div>
      <div class="fi"><input type="text" inputmode="decimal" id="mood" class="score-input"></div>
    </div>
    <div class="field">
      <div class="fl">Energy</div>
      <div class="fi"><input type="text" inputmode="decimal" id="energy" class="score-input"></div>
    </div>
  </div>

  <!-- ROUTINE -->
  <div class="card">
    <div class="clabel">Routine</div>

    <div class="field">
      <div class="fl">Wake</div>
      <div class="fi"><input type="text" id="wake" class="time-input" placeholder="HH:MM" maxlength="5"></div>
    </div>
    <div class="field">
      <div class="fl">OOB</div>
      <div class="fi"><input type="text" id="oob" class="time-input" placeholder="HH:MM" maxlength="5"></div>
    </div>
    <div class="field">
      <div class="fl">Bed</div>
      <div class="fi">
        <div class="yn-row">
          <input type="text" id="bedtime" class="time-input" placeholder="HH:MM" maxlength="5">
          <div class="mins-group" style="border-left:none; padding-left:10px;">
            <span class="mins-label" style="margin-right:6px;">quality</span>
            <input type="text" inputmode="decimal" id="sleep-quality" class="score-input">
          </div>
        </div>
      </div>
    </div>
    <div class="field">
      <div class="fl">Sleep Notes</div>
      <div class="fi"><textarea id="sleep-notes"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Dreams</div>
      <div class="fi"><textarea id="dreams"></textarea></div>
    </div>

    <div class="field">
      <div class="fl">Meditate</div>
      <div class="fi">
        <div class="yn">
          <label><input type="radio" name="meditate" value="Y"> Y</label>
          <label><input type="radio" name="meditate" value="N"> N</label>
        </div>
      </div>
    </div>
    <div class="field">
      <div class="fl">Notes</div>
      <div class="fi"><textarea id="meditate-notes"></textarea></div>
    </div>
  </div>

  <!-- NUTRITION -->
  <div class="card">
    <div class="clabel">Nutrition</div>
    <div class="field">
      <div class="fl">Breakfast</div>
      <div class="fi"><textarea id="breakfast" class="tall"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Lunch</div>
      <div class="fi"><textarea id="lunch" class="tall"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Dinner</div>
      <div class="fi"><textarea id="dinner" class="tall"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Snacks</div>
      <div class="fi"><textarea id="snacks"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Water</div>
      <div class="fi">
        <div class="nrow">
          <input type="number" id="water" min="0" step="0.1" placeholder="0">
          <span class="unit">L</span>
        </div>
      </div>
    </div>
  </div>

  <!-- SUPPLEMENTS -->
  <div class="card">
    <div class="clabel">Supplements</div>
    <div class="field">
      <div class="fl" style="background:#fdfcfa;"></div>
      <div class="fi">
        <div class="supp-list" id="suppList"></div>
        <button class="supp-reset" onclick="resetSupps()">reset all</button>
      </div>
    </div>
    <div class="field">
      <div class="fl">Notes</div>
      <div class="fi"><textarea id="supplements-notes"></textarea></div>
    </div>
  </div>

  <!-- TRAINING -->
  <div class="card">
    <div class="clabel">Training</div>
    <div class="field">
      <div class="fl">Stretch</div>
      <div class="fi">
        <div class="yn">
          <label><input type="radio" name="stretch" value="Y"> Y</label>
          <label><input type="radio" name="stretch" value="N"> N</label>
        </div>
      </div>
    </div>
    <div class="field">
      <div class="fl">Notes</div>
      <div class="fi"><textarea id="stretch-notes"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Gym Notes</div>
      <div class="fi"><textarea id="gym-notes" class="tall"></textarea></div>
    </div>
  </div>

  <!-- REFLECTIONS -->
  <div class="card">
    <div class="clabel">Reflections</div>
    <div class="field">
      <div class="fl">Bilby</div>
      <div class="fi"><textarea id="bilby"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Bobu</div>
      <div class="fi"><textarea id="bobu"></textarea></div>
    </div>
    <div class="field">
      <div class="fl">Notes</div>
      <div class="fi"><textarea id="reflections" class="tall"></textarea></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-p" onclick="formatJournal()">Format Entry</button>
    <button class="btn-o" onclick="clearForm()">Clear</button>
  </div>

  <div class="out-wrap" id="outWrap">
    <div class="out-hdr">
      <span class="out-lbl">Formatted Entry</span>
      <div class="out-btns">
        <span class="copy-ok" id="copyOk">Copied</span>
        <button class="btn-s" onclick="copyOutput()">Copy</button>
        <button class="btn-s" onclick="exportTxt()">Export .txt</button>
      </div>
    </div>
    <div id="output"></div>

    <div class="vault-bar">
      <div class="vault-status">
        <span class="vault-dot" id="vaultDot"></span>
        <span id="vaultLabel">No vault set</span>
        &nbsp;<button class="vault-change" id="vaultChangeBtn" onclick="changeVault()" style="display:none">change</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="vault-saved" id="vaultSaved">Saved</span>
        <button class="btn-vault" onclick="saveToVault()">Save to Vault</button>
      </div>
    </div>
  </div>

</div>
<script>
// ─── Supplements ──────────────────────────────────────────────────────────────
const SUPPS = [
  { id: 'creatine',  name: 'Creatine',            dose: '5 g'    },
  { id: 'vitc',      name: 'High Strength C',     dose: '1 g'    },
  { id: 'magnesium', name: 'Magnesium Glycinate', dose: '300 mg' },
  { id: 'vitd',      name: 'Vitamin D (D3)',      dose: '25 mcg' },
  { id: 'zinc',      name: 'Zinc',                dose: '25 mg'  },
];
const N_CUSTOM = 3;

const suppList = document.getElementById('suppList');
SUPPS.forEach(s => {
  const row = document.createElement('div');
  row.className = 'supp-item';
  row.innerHTML = `
    <span class="supp-name">${s.name}</span>
    <span class="supp-dose">${s.dose}</span>
    <div class="stepper">
      <button class="step-btn" onclick="stepSupp(this,-1)">−</button>
      <span class="step-val" id="supp-${s.id}-count">0</span>
      <button class="step-btn" onclick="stepSupp(this,1)">+</button>
    </div>`;
  suppList.appendChild(row);
});
for (let i = 0; i < N_CUSTOM; i++) {
  const row = document.createElement('div');
  row.className = 'supp-item';
  row.innerHTML = `
    <input type="text" class="supp-name-input" id="custom-supp-${i}-name" placeholder="supplement name">
    <input type="text" class="supp-dose-input" id="custom-supp-${i}-dose" placeholder="dose">
    <div class="stepper">
      <button class="step-btn" onclick="stepSupp(this,-1)">−</button>
      <span class="step-val" id="custom-supp-${i}-count">0</span>
      <button class="step-btn" onclick="stepSupp(this,1)">+</button>
    </div>`;
  suppList.appendChild(row);
}

function stepSupp(btn, delta) {
  const el = btn.closest('.stepper').querySelector('.step-val');
  const n  = Math.max(0, (parseInt(el.textContent) || 0) + delta);
  el.textContent = n;
  el.classList.toggle('active', n > 0);
}
function resetSupps() {
  document.querySelectorAll('.step-val').forEach(el => { el.textContent = '0'; el.classList.remove('active'); });
}
function calcDose(doseStr, count) {
  if (!doseStr || count === 0) return null;
  if (count === 1) return doseStr;
  const m = doseStr.trim().match(/^([\d.]+)\s*(.*)$/);
  if (!m) return doseStr;
  const total = parseFloat(m[1]) * count;
  const unit  = m[2].trim();
  const str   = Number.isInteger(total) ? String(total) : String(parseFloat(total.toFixed(6)));
  return unit ? `${str} ${unit}` : str;
}


// ─── Date ─────────────────────────────────────────────────────────────────────
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function getDateStr() { const d = new Date(); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

// ─── Auto-colon for time inputs ───────────────────────────────────────────────
document.querySelectorAll('.time-input').forEach(inp => {
  inp.addEventListener('input', function(e) {
    if (e.inputType === 'deleteContentBackward') {
      if (this.value.endsWith(':')) this.value = this.value.slice(0, -1);
      return;
    }
    let digits = this.value.replace(/\D/g, '');
    if (digits.length >= 3) digits = digits.slice(0,2) + ':' + digits.slice(2,4);
    this.value = digits;
  });
});

// ─── Y/N radio unselect ───────────────────────────────────────────────────────
document.querySelectorAll('.yn input[type="radio"]').forEach(radio => {
  radio.addEventListener('mousedown', function() {
    if (this.checked) setTimeout(() => { this.checked = false; }, 0);
  });
});

const dateInput = document.getElementById('journalDate');
dateInput.value = getDateStr();
dateInput.style.width = (dateInput.value.length + 1) + 'ch';
dateInput.addEventListener('input', function() { this.style.width = Math.max(this.value.length + 1, 10) + 'ch'; });


// ─── Sleep duration ───────────────────────────────────────────────────────────
function sleepDuration(bed, wake) {
  if (!bed || !wake) return null;
  const [bh, bm] = bed.split(':').map(Number);
  const [wh, wm] = wake.split(':').map(Number);
  let bedMins  = bh * 60 + bm;
  let wakeMins = wh * 60 + wm;
  if (wakeMins <= bedMins) wakeMins += 24 * 60;
  const total = wakeMins - bedMins;
  const hrs   = Math.floor(total / 60);
  const mins  = total % 60;
  return mins === 0 ? `${hrs} hr${hrs !== 1 ? 's' : ''}` : `${hrs} hr${hrs !== 1 ? 's' : ''} ${mins} min`;
}


// ─── Mechanical rules ─────────────────────────────────────────────────────────
function removePeriods(t) { return t.replace(/\.(?!\d)/g, ''); }
function addUnitSpaces(t) { return t.replace(/(\d)(mcg|g|kg|mg|ml|mL|L|oz|lb|lbs|km|cm|mm|cal|kcal|min|sec|hrs?)(?!\w)/g, '$1 $2'); }
function enDashRanges(t)  { return t.replace(/(\d)\s*-\s*(\d)/g, '$1–$2'); }
function clean(t) { if (!t) return ''; return enDashRanges(addUnitSpaces(removePeriods(t))); }


// ─── Notes → bullets ──────────────────────────────────────────────────────────
function toBullets(input) {
  if (!input || !input.trim()) return null;
  return input.split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => '- ' + clean(l.replace(/^[-•*]\s*/, ''))).join('\n');
}


// ─── Diet ─────────────────────────────────────────────────────────────────────
const STRIP_UNITS = ['cups?','tbsps?','tablespoons?','tsps?','teaspoons?','mcg','g','kg','mg','ml','mL','L','oz','lbs?','pieces?','slices?','handfuls?','pinch(?:es)?','scoops?','cans?','bottles?','packets?','serves?','servings?','cloves?','sprigs?','stalks?','heads?','medium','large','small','whole','half','x'];
const UNIT_RE = new RegExp('^(' + STRIP_UNITS.join('|') + ')\\s+', 'i');

function sortKey(s) {
  s = s.trim().toLowerCase().replace(/\([^)]*\)/g, '').replace(/~/g, '').trim();
  s = s.replace(/^\d+\s*\/\s*\d+\s+/, '').replace(/^\d+\.?\d*\s+/, '');
  s = s.replace(UNIT_RE, '').replace(/^\d+\.?\d*\s+/, '');
  return s.trim();
}
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function formatMealBlock(block) {
  const lines = block.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return '';
  const label = cap(clean(lines[0]));
  let out = `- ${label}`;
  if (lines.length > 1) {
    let ingText = lines.slice(1).join(', ').replace(/^ingredients:\s*/i, '');
    const ings = ingText.split(',').map(i => clean(i.trim())).filter(Boolean);
    ings.sort((a, b) => sortKey(a).localeCompare(sortKey(b), undefined, { sensitivity: 'base' }));
    out += `\n- ingredients: ${ings.join(' / ')}`;
  }
  return out;
}
function formatDiet(input) {
  if (!input || !input.trim()) return null;
  return input.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(formatMealBlock).join('\n\n');
}


// ─── Supplement output ────────────────────────────────────────────────────────
function getSuppOutput() {
  const lines = [];
  SUPPS.forEach(s => {
    const count = parseInt(document.getElementById(`supp-${s.id}-count`).textContent) || 0;
    if (count > 0) lines.push(`- ${s.name}: ${calcDose(s.dose, count)}`);
  });
  for (let i = 0; i < N_CUSTOM; i++) {
    const name  = document.getElementById(`custom-supp-${i}-name`).value.trim();
    const dose  = document.getElementById(`custom-supp-${i}-dose`).value.trim();
    const count = parseInt(document.getElementById(`custom-supp-${i}-count`).textContent) || 0;
    if (name && count > 0) {
      const total = dose ? calcDose(clean(dose), count) : null;
      lines.push(total ? `- ${name}: ${total}` : `- ${name}`);
    }
  }
  return lines.length ? lines.join('\n') : null;
}


// ─── Helpers ──────────────────────────────────────────────────────────────────
function v(id)     { return document.getElementById(id).value.trim(); }
function radio(nm) { const el = document.querySelector(`input[name="${nm}"]:checked`); return el ? el.value : null; }


// ─── Formatter ────────────────────────────────────────────────────────────────
function formatJournal() {
  const p = [];

  p.push(v('journalDate') || getDateStr());
  p.push('');

  p.push('WAKE UP:');
  const wake = v('wake');
  if (wake) p.push(wake);
  p.push('');

  p.push('OOB:');
  const oob = v('oob');
  if (oob) p.push(oob);
  p.push('');

  // Sleep block
  const bed    = v('bedtime');
  const sleepQ = v('sleep-quality');
  p.push('SLEEP:');
  if (bed || wake) {
    p.push(`${bed ? '~' + bed : 'idk'}–${wake || 'idk'}`);
    const dur = (bed && wake) ? sleepDuration(bed, wake) : null;
    p.push(dur ? `~${dur}` : '—');
  }
  if (sleepQ) p.push(`${sleepQ}/10`);
  p.push('NOTES:');
  const sleepNotes = toBullets(v('sleep-notes'));
  if (sleepNotes) p.push(sleepNotes);
  p.push('');

  p.push('DREAMS:');
  const dreams = v('dreams');
  if (dreams) p.push(clean(dreams));
  p.push('');

  p.push('DAILY INTENTION:');
  const intention = v('intention');
  if (intention) p.push(clean(intention));
  p.push('');

  p.push('MOOD:');
  const mood = v('mood');
  if (mood) p.push(`${mood}/10`);
  p.push('');

  p.push('ENERGY:');
  const energy = v('energy');
  if (energy) p.push(`${energy}/10`);
  p.push('');

  // Meditate block
  p.push('MEDITATE:');
  const medYN = radio('meditate');
  if (medYN) p.push(medYN);
  p.push('NOTES:');
  const medNotes = toBullets(v('meditate-notes'));
  if (medNotes) p.push(medNotes);
  p.push('');

  // Meals
  for (const [label, id] of [['BREAKFAST','breakfast'],['LUNCH','lunch'],['DINNER','dinner']]) {
    p.push(`${label}:`);
    const meal = formatDiet(v(id));
    if (meal) p.push(meal);
    p.push('');
  }

  // Snacks — simple bullets
  p.push('SNACKS:');
  const snacks = toBullets(v('snacks'));
  if (snacks) p.push(snacks);
  p.push('');

  p.push('WATER:');
  const water = v('water');
  if (water) p.push(`${water} L`);
  p.push('');

  // Supplements block
  p.push('SUPPLEMENTS:');
  const suppOut = getSuppOutput();
  if (suppOut) p.push(suppOut);
  p.push('NOTES:');
  const suppNotes = toBullets(v('supplements-notes'));
  if (suppNotes) p.push(suppNotes);
  p.push('');

  // Stretch block
  p.push('STRETCH:');
  const stretchYN = radio('stretch');
  if (stretchYN) p.push(stretchYN);
  p.push('NOTES:');
  const stretchNotes = toBullets(v('stretch-notes'));
  if (stretchNotes) p.push(stretchNotes);
  p.push('');

  // Gym block
  p.push('GYM:');
  p.push('NOTES:');
  const gymNotes = toBullets(v('gym-notes'));
  if (gymNotes) p.push(gymNotes);
  p.push('');

  p.push('BILBY:');
  const bilby = v('bilby');
  if (bilby) p.push(clean(bilby));
  p.push('');

  p.push('BOBU:');
  const bobu = v('bobu');
  if (bobu) p.push(clean(bobu));
  p.push('');

  p.push('NOTES / REFLECTIONS:');
  const reflections = v('reflections');
  if (reflections) p.push(clean(reflections));

  document.getElementById('output').textContent = p.join('\n');
  const wrap = document.getElementById('outWrap');
  wrap.classList.add('show');
  setTimeout(() => wrap.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}


// ─── Copy / Export ────────────────────────────────────────────────────────────
function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('output').textContent).then(() => {
    const el = document.getElementById('copyOk');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  });
}
function exportTxt() {
  const d = new Date();
  const name = `journal-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.txt`;
  Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([document.getElementById('output').textContent], { type: 'text/plain' })),
    download: name,
  }).click();
}


// ─── Vault ────────────────────────────────────────────────────────────────────
const DB_NAME = 'journal-vault', DB_VER = 1, STORE = 'settings';

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}
async function dbPut(key, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r  = tx.objectStore(STORE).get(key);
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}

function setVaultUI(name) {
  const dot   = document.getElementById('vaultDot');
  const label = document.getElementById('vaultLabel');
  const btn   = document.getElementById('vaultChangeBtn');
  if (name) {
    dot.classList.add('connected');
    label.innerHTML = `Saving to <span class="vault-name">${name}</span>`;
    btn.style.display = 'inline';
  } else {
    dot.classList.remove('connected');
    label.textContent = 'No vault set — click Save to choose a folder';
    btn.style.display = 'none';
  }
}

dbGet('vaultName').then(name => { if (name) setVaultUI(name); }).catch(() => {});

async function getVaultHandle() {
  const handle = await dbGet('vaultDir');
  if (!handle) return null;
  let perm = await handle.queryPermission({ mode: 'readwrite' });
  if (perm === 'prompt') perm = await handle.requestPermission({ mode: 'readwrite' });
  return perm === 'granted' ? handle : null;
}

function mdFilename() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.md`;
}

function downloadMd(text, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  const fb = document.getElementById('vaultSaved');
  fb.textContent = 'Downloaded — move to vault';
  fb.classList.add('show');
  setTimeout(() => { fb.classList.remove('show'); fb.textContent = 'Saved'; }, 4000);
}

async function saveToVault() {
  const text = document.getElementById('output').textContent.trim();
  if (!text) { alert('Format your entry first.'); return; }
  const name = mdFilename();
  if (typeof window.showDirectoryPicker !== 'function') { downloadMd(text, name); return; }
  let dirHandle = await getVaultHandle();
  if (!dirHandle) {
    try {
      dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      await dbPut('vaultDir',  dirHandle);
      await dbPut('vaultName', dirHandle.name);
      setVaultUI(dirHandle.name);
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not access folder: ' + e.message);
      return;
    }
  }
  try {
    const file     = await dirHandle.getFileHandle(mdFilename(), { create: true });
    const writable = await file.createWritable();
    await writable.write(text);
    await writable.close();
    const fb = document.getElementById('vaultSaved');
    fb.textContent = 'Saved';
    fb.classList.add('show');
    setTimeout(() => fb.classList.remove('show'), 2500);
  } catch (e) {
    alert(`Could not write file — try clicking "change" to re-select the folder.\n\n${e.message}`);
  }
}

async function changeVault() {
  try {
    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await dbPut('vaultDir',  dirHandle);
    await dbPut('vaultName', dirHandle.name);
    setVaultUI(dirHandle.name);
  } catch (e) {
    if (e.name !== 'AbortError') alert('Could not access folder: ' + e.message);
  }
}


// ─── Clear ────────────────────────────────────────────────────────────────────
function clearForm() {
  document.querySelectorAll('textarea, input[type="number"], input[type="text"]:not(#journalDate), .supp-name-input, .supp-dose-input').forEach(el => el.value = '');
  document.querySelectorAll('input[type="radio"]').forEach(el => el.checked = false);
  resetSupps();
  document.getElementById('journalDate').value = getDateStr();
  document.getElementById('outWrap').classList.remove('show');
}
